services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-rentspot}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER:-rentspot}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
    volumes:
      - mysql_prod_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      APP_NAME: RENTSPOT
      APP_ENV: production
      APP_KEY: ${APP_KEY:?set APP_KEY}
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:?set APP_URL}
      FRONTEND_URL: ${FRONTEND_URL:?set FRONTEND_URL}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-rentspot}
      DB_USERNAME: ${MYSQL_USER:-rentspot}
      DB_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
      CACHE_DRIVER: file
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: file
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}
    volumes:
      - backend_storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy

  backend-nginx:
    build:
      context: ./backend
      dockerfile: Dockerfile.nginx-prod
    restart: unless-stopped
    volumes:
      - backend_storage:/var/www/html/storage:ro
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: /api
        VITE_BACKEND_URL: ""
        VITE_PAYPAL_CLIENT_ID: ${VITE_PAYPAL_CLIENT_ID:-}
        VITE_PAYPAL_CURRENCY: ${VITE_PAYPAL_CURRENCY:-USD}
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend-nginx

volumes:
  mysql_prod_data:
  backend_storage:
