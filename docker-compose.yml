services:
  mysql:
    image: mysql:8.0
    container_name: rentspot-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: rentspot
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: rentspot
      MYSQL_PASSWORD: rentspot
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:5
    container_name: rentspot-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8081:80"
    depends_on:
      mysql:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rentspot-backend
    restart: unless-stopped
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8001
      FRONTEND_URL: http://localhost:5174
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: rentspot
      DB_USERNAME: rentspot
      DB_PASSWORD: rentspot
      SANCTUM_STATEFUL_DOMAINS: localhost:5174,127.0.0.1:5174,frontend:5174
      RUN_MIGRATIONS: "true"
      RUN_SEEDERS: "false"
    ports:
      - "8001:8001"
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rentspot-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8001/api
      VITE_BACKEND_URL: http://localhost:8001
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5174:5174"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  mysql_data:
  backend_vendor:
  frontend_node_modules:
